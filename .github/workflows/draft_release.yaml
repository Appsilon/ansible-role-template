---
name: Draft a Release
'on':
  push:
    branches:
      - main

jobs:

  draft_release:
    name: Draft a Release
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@09c613e259eb8d4e7c81c2cb00618eb5fc4575a7 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
